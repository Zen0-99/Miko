name: iOS app — build & network probe

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port
    paths:
      - 'ios-app/**'
      - 'iosApp/**'
      - 'core/network/**'
      - 'core/common/**'
      - 'i18n/**'
      - 'source-api/**'
      - 'source-js/**'
      - 'domain/**'
      - 'data/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/ios-app.yml'

jobs:
  ios-app:
    name: MikoKit framework + real-app network probe
    runs-on: macos-15

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          gradle-version: "8.13"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Compile core:network for iOS (contract module)
        run: ./gradlew :core:network:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Compile i18n for iOS (Phase 26 gate)
        run: ./gradlew :i18n:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Compile core:common for iOS (Phase 26 gate)
        run: ./gradlew :core:common:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Compile domain for iOS (Phase 26 gate)
        run: ./gradlew :domain:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Compile data for iOS (Phase 26-03 gate)
        run: ./gradlew :data:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Compile source-api for iOS (Phase 24 gate)
        run: ./gradlew :source-api:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Compile source-js for iOS (Phase 25 gate)
        run: ./gradlew :source-js:compileKotlinIosSimulatorArm64 --stacktrace

      - name: source-js iOS runtime tests (JSCore bridge probe)
        run: |
          set +e
          ./gradlew :source-js:iosSimulatorArm64Test -Porg.jetbrains.kotlin.native.internal.enforceStrictPlistSanityCheck=false 2>&1 | tee /tmp/jsruntime-test.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            mkdir -p /tmp/artifacts && cp /tmp/jsruntime-test.log /tmp/artifacts/
          fi
          exit $STATUS

      - name: Upload source-js test log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-js-ios-test-log
          path: /tmp/artifacts/
          if-no-files-found: ignore

      - name: Link MikoKit framework (iosSimulatorArm64)
        run: ./gradlew :ios-app:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen

      - name: Create probe simulator (image device list varies)
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; rts=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and 'iOS' in r['name']]; print(rts[-1]['identifier'])")
          echo "runtime: $RUNTIME"
          SIM_ID=$(xcrun simctl create MikoProbe com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME" 2>/dev/null \
            || xcrun simctl create MikoProbe com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME")
          echo "sim_id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: xcodebuild test — Track B2 live-network probe in real .app bundle
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim_id }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-app-xcodebuild-logs
          path: |
            iosApp/build/DerivedData/Logs/
            iosApp/iosApp.xcodeproj/
          if-no-files-found: ignore
