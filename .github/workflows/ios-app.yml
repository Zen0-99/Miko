name: iOS app — build & network probe

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port
    paths:
      - 'ios-app/**'
      - 'iosApp/**'
      - 'core/network/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/ios-app.yml'

jobs:
  ios-app:
    name: MikoKit framework + real-app network probe
    runs-on: macos-15

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          gradle-version: "8.13"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Compile core:network for iOS (contract module)
        run: ./gradlew :core:network:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Link MikoKit framework (iosSimulatorArm64)
        run: ./gradlew :ios-app:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen

      - name: xcodebuild test — Track B2 live-network probe in real .app bundle
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-app-xcodebuild-logs
          path: |
            iosApp/build/DerivedData/Logs/
            iosApp/iosApp.xcodeproj/
          if-no-files-found: ignore
